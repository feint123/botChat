 轨迹表格」之间变化，恒定与主会话同一套呈现，不再出现两面观感不一致。"],more:0},{title:"修复",items:["修正主管进度播报在特定流式分片下静默丢失资源引用的问题：当终稿正文与首帧恰好逐字节相同时，本应挂在该气泡下的子代理碰过的图片与文件会整条缺失、且界面与日志都不报错；现在定稿写入始终执行，资源条稳定出现。"],more:0}]},{version:"1.1.32",date:"Sat, 28 Nov 2026 09:21:49 +0800",url:"https://feint123.github.io/botChat/notes/botChat-1.1.32.html",headline:"本轮把聊天模式下「读正文」这条路补齐：正文收进可展开的卡片、点开有全文面板可复制；内置斜杠指令在安装版里恢复可用；长任务到达步数上限时也不再整轮作废。另修复正文附件错轮与输入光标左偏两处问题。",sections:[{title:"功能新增",items:["聊天模式下的本轮正文现在收进一枚「正文」卡片：卡片显示字数与首行预览，点开弹出全文面板，并可一键复制全文。委派给子助手产出的正文同样能展开阅读，取不到时如实标注「正文已不可用」。","内置斜杠指令随应用分发：/compact、/create-goals、/insight、/loop、/schedule 在安装版里无需任何额外配置即可在输入框直接使用。","新增 execute-tool-analysis 技能，可对本机工具执行情况取证并生成质量报告。"],more:0},{title:"改进",items:["长任务到达执行步数上限时，主助手会先做一次纯文本收尾，把已完成的工作、未完成项与关键文件路径说清楚，而不是直接报错让用户从头再来。","聊天里的附件卡片改用更清晰的表面层次，与聊天气泡明确区分开。","图片引用区统一了单图与多图的显示方式：单张图片现在也支持悬停展开与文件名浮出，交互与多图一致。"],more:0},{title:"修复",items:["修正多轮对话里正文附件挂到相邻轮的问题，附件现在跟随其所属的那一轮显示。","修正输入框列表项折行后光标位置左偏的问题，换行后光标与正文对齐。"],more:0}]},{version:"1.1.31",date:"Fri, 27 Nov 2026 16:42:53 +0800",url:"https://feint123.github.io/botChat/notes/botChat-1.1.31.html",headline:"本轮让提问的答案直接显示在聊天里并统一用引用块呈现，主助手的收尾说明支持附带图片直接显示。另将提交方案改为时间线批次记录、剩余方案可直接再提，并改进收尾句显示时序，修复工具超时与服务复用两处稳定性问题。",sections:[{title:"功能新增",items:["聊天流现在会显示你对提问的回答，单选、多选、判断与自由输入统一用引用块呈现，答完才出现，历史会话与应用重启后依然可见。","主助手的收尾说明支持附带图片资源，图片直接显示在说明上方，不再需要单独点开图片气泡。"],more:0},{title:"改进",items:["提交方案的执行记录改为时间线内的批次记录；失败或跳过的分组保留为剩余方案，可直接重新提交，无需从头规划。","主助手收尾句按状态上屏，待播报阶段不再闪现正文。"],more:0},{title:"修复",items:["修正工具执行的超时控制，将单帧静默等待纳入总预算，长时间无输出的调用不再挂住。","修复多个 botChat 实例各自启动服务端、共写同一份库的问题，退出时也不再误杀正在运行的正式服务。"],more:0}]},{version:"1.1.30",date:"Thu, 26 Nov 2026 22:42:19 +0800",url:"https://feint123.github.io/botChat/notes/botChat-1.1.30.html",headline:"本轮聊天模式缺省不再展开助手正文，正文改为按设置开关显示；定时任务支持清理执行记录；主助手的收尾结论改为生成后即时上屏。另提升终态输出上限、延长长任务连接超时，并修复侧栏更新入口缺失与一处崩溃问题。",sections:[{title:"功能新增",items:["定时任务支持清理执行记录：可删除单期执行记录，也可按状态批量清理；删除均需二次确认，并说明会一并删除对应执行会话。","聊天模式新增「在聊天流中显示助手正文」开关（设置页，缺省关闭）。关闭后聊天流只保留接话、进度与收尾句，不再出现与收尾句内容重叠的正文气泡；正文仍完整保存，可在轨迹视图与子会话面板查看。"],more:0},{title:"改进",items:["主助手的收尾结论改为生成后立即上屏，不再需要切换会话或发送下一条消息才出现。","子助手结果与主助手收尾句的输出上限由 400 字提升到 2000 字，带文件清单与结论的收尾不再被截断。","侧栏在检测到新版本时显示更新入口，可直接在应用内查看并安装更新。"],more:2},{title:"修复",items:["修复侧栏品牌与配色环境默认值在特定视图复制路径下悬垂，可能触发崩溃（EXC_BAD_ACCESS）的问题。","修复内嵌服务可能被重复启动的问题，启动过程增加身份判定与互斥。"],more:0}]}],Xl=[{version:"1.1.29",date:"Wed, 25 Nov 2026 16:12:51 +0800",url:"https://feint123.github.io/botChat/notes/botChat-1.1.29.html"},{version:"1.1.28",date:"Tue, 24 Nov 2026 07:58:26 +0800",url:"https://feint123.github.io/botChat/notes/botChat-1.1.28.html"},{version:"1.1.27",date:"Mon, 23 Nov 2026 11:25:33 +0800",url:"https://feint123.github.io/botChat/notes/botChat-1.1.27.html"},{version:"1.1.26",date:"Sun, 22 Nov 2026 18:48:21 +0800",url:"https://feint123.github.io/botChat/notes/botChat-1.1.26.html"},{version:"1.1.25",date:"Sun, 22 Nov 2026 12:33:45 +0800",url:"https://feint123.github.io/botChat/notes/botChat-1.1.25.html"},{version:"1.1.24",date:"Sat, 21 Nov 2026 15:26:46 +0800",url:"https://feint123.github.io/botChat/notes/botChat-1.1.24.html"},{version:"1.1.23",date:"",url:"https://feint123.github.io/botChat/notes/botChat-1.1.23.html"},{version:"1.1.22",date:"",url:"https://feint123.github.io/botChat/notes/botChat-1.1.22.html"},{version:"1.1.21",date:"",url:"https://feint123.github.io/botChat/notes/botChat-1.1.21.html"},{version:"1.1.20",date:"",url:"https://feint123.github.io/botChat/notes/botChat-1.1.20.html"},{version:"1.1.19",date:"",url:"https://feint123.github.io/botChat/notes/botChat-1.1.19.html"},{version:"1.1.18",date:"",url:"https://feint123.github.io/botChat/notes/botChat-1.1.18.html"},{version:"1.1.17",date:"",url:"https://feint123.github.io/botChat/notes/botChat-1.1.17.html"},{version:"1.1.16",date:"",url:"https://feint123.github.io/botChat/notes/botChat-1.1.16.html"},{version:"1.1.15",date:"",url:"https://feint123.github.io/botChat/notes/botChat-1.1.15.html"},{version:"1.1.14",date:"",url:"https://feint123.github.io/botChat/notes/botChat-1.1.14.html"},{version:"1
