<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>botChat 演示页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#333}
.card{background:#fff;border-radius:20px;max-width:640px;width:100%;padding:48px 40px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.badge{display:inline-block;background:#eef2ff;color:#4f46e5;font-size:13px;font-weight:600;padding:6px 16px;border-radius:999px;margin-bottom:20px}
h1{font-size:32px;margin-bottom:12px;color:#111}
p.desc{color:#666;line-height:1.8;margin:12px 0 28px}
.features{display:flex;gap:12px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
.features span{background:#f5f3ff;border:1px solid #e5e0ff;padding:8px 16px;border-radius:10px;font-size:14px}
.btn{display:inline-block;background:linear-gradient(90deg,#667eea,#764ba2);color:#fff;text-decoration:none;padding:12px 36px;border-radius:12px;font-weight:600}
footer{margin-top:24px;font-size:12px;color:#aaa}
</style>
</head>
<body>
<main class="card">
<div class="badge">GitHub Pages Demo</div>
<h1>🤖 botChat 演示页</h1>
<p class="desc">这是 botChat 的演示页，用于 GitHub Pages 展示。<br>页面为静态 HTML，可直接在浏览器中打开预览。</p>
<div class="features"><span>✨ 界面美观</span><span>📱 响应式</span><span>🚀 静态托管</span></div>
<a class="btn" href="#">开始体验</a>
<footer>botChat · Demo · 2026</footer>
</main>
</body>
</html>
