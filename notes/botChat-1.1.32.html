<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>botChat 1.1.32</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0 auto; max-width: 720px; padding: 32px 20px 64px;
         font: 15px/1.7 -apple-system, "PingFang SC", system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  h3 { font-size: 15px; margin: 22px 0 8px; }
  ul { padding-left: 22px; }
  li { margin: 4px 0; }
  code { background: rgba(127,127,127,.16); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  pre { background: rgba(127,127,127,.12); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  a { color: #0a66c2; }
</style>
</head>
<body>
<h1>botChat 1.1.32</h1>
<p>本轮让聊天里的附件与图片显示更统一，并让长时间运行的任务到达步数上限时能正常收尾，不再整轮作废。</p>
<h3>改进</h3>
<ul>
  <li>长任务到达执行步数上限时，主助手会先做一次纯文本收尾，把已完成的工作、未完成项与关键文件路径说清楚，而不是直接报错让用户从头再来。</li>
  <li>聊天里的附件卡片改用更清晰的表面层次，与聊天气泡明确区分开。</li>
  <li>图片引用区统一了单图与多图的显示方式：单张图片现在也支持悬停展开与文件名浮出，交互与多图一致。</li>
</ul>
</body>
</html>
