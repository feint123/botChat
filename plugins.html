s` 里。**没有「纯客户端面板」** —— 原生面板仍由服务端产数据。'),i("json",['"client.view": [{ "slot": "panel", "view": "hits", "title": "命中", "render": "native" }],','"client.panel": { "views": [{ "view": "hits", "entry": "Panels/Hits.swift", "apiVersion": 1 }] }']),s("`entry` MUST 是包内相对路径、`.swift`、不逃出包根、单文件 ≤ 256 KB；另一种形态是 `bundle`（作者侧用自带 Xcode + Kit 预编好的自包含产物，`.bundle`）。两者至少一个，都给时由客户端按「bundle 优先、否则 entry」解析。`apiVersion` 只认 `1`。"),d("入口必须是一个 C 符号"),o("旧的固定类名已被门禁拦下",'入口 MUST 用 `@_cdecl("botchat_panel_entry")` **导出恰好一次**，MUST NOT 给入口挂固定 ObjC 类名。`@objc(BotChatPanelEntry)` 这类写法报 `nativeSourceRejected`（文案「入口类名固定（已废弃写法）」）—— 类名是**进程级全局命名空间**，ObjC runtime 对同名类只注册先到者，同进程第二个面板必然拿不到自己的类。',"宿主只认这个 **C 符号**（按镜像解析，不按类名查表）；缺符号或入口返空 ⇒ `nativeEntryMissing`（不是白屏）；导出两次是链接期重复符号 ⇒ `nativeCompileFailed`。"),i("swift",["struct MainPanelEntry: PanelEntry {","    static func makeInstance(host: PanelHost) -> PanelInstance { MainPanelInstance(host: host) }","}","","/// 宿主按符号 `botchat_panel_entry` 取它（按镜像解析，不按类名查表）。",'@_cdecl("botchat_panel_entry")',"public func mainPanelEntry(_ hostRaw: UnsafeMutableRawPointer) -> UnsafeMutableRawPointer? {","    botchatPanelInstance(MainPanelEntry.self, hostRaw)","}"]),s("`PanelInstance` 的实现类**仍需**是 `NSObject` 子类（它是 `@objc` 协议，要 ObjC 兼容）；入口类型只 conform `PanelEntry`，可以是 struct / enum。"),d("视图函数回的是数据，不是树"),s("顶层 MUST 是 JSON 对象、≤256 KB、深度 ≤8、单数组 ≤2000 项、键名 `[A-Za-z_][A-Za-z0-9_]*` 且 MUST NOT 以 `_` 开头、图片只允许裸 `assetId` 或 `/api/media/{id}`。越界是**整帧拒 + 占位，MUST NOT 截断后继续渲染**（截断会让面板显示半张表，用户看不出少了什么）。本地第二个纯函数：`app.extensions.ui_panel_payload.validate_panel_data(data)`。"),a(["纪律","口径"],[["实例持有视图","`update(data:)` 里只换 `hosting.rootView`，MUST NOT 重建 `NSView` / `NSHostingView` —— 实测同类型 `rootView` 赋值能保住 `@State`（滚动、焦点、输入框内容），重建会全丢"],["幂等","同一份 data 连推两次结果一致"],["取色","只经 `host.panelColor(role)`（或 `host.color(role)`），返回动态色，MUST NOT 转成固定 RGB 缓存，否则主题切换后不跟随"],["视觉同源","用 `BotChatKit` 的组件与角色；面板根 MUST 挂 `panelKitRoot(host)` 注入 palette 并钉住字号缩放，MUST NOT 自建 palette"],["不许自己取数","数据一律来自 `data`，动作一律 `host.dispatch`（宿主生成幂等 action_id 并串行发给服务端）"],["尺寸","由宿主钳制（`composer.accessory` ≤44pt、`sidebar.section` ≤240pt、`panel` 随列宽）"]]),s("源码门禁（`PanelSourceGate.swift`，**注释文本同样命中**）：import 只许 `SwiftUI` `AppKit` `Foundation` `Observation` `CoreGraphics` `AVKit` `AVFoundation` `BotChatKit`；禁用符号子串匹配 `FileManager` `URLSession` `Process(` `NSTask` `NSAppleScript` `NSWorkspace` `dlopen` `dlsym` `SecItem` `CGEvent` `AXUIElement` `NSWindow(` `NSPanel(`；写死颜色一律拒；≤256 KB / ≤4000 行。"),s("编译链：包内 `Panels/X.swift` → 门禁 → `swiftc`（SDK 源 + 面板源同批）→ `Panel.bundle` → 实例。参数固定 `-emit-library -Xlinker -bundle -module-name P_<hash8> -swift-version 5 -Onone`，模块名必带哈希。缓存键 = 面板源码 + SDK 源 + 参数 + `swiftc --version`，落 `~/Library/Application Support/botChat/PanelBuilds/<hash>/`。无工具链 ⇒ `nativeToolchainMissing` 占位 + 安装指引，**没有旁路渲染**。"),s("两个客户端侧事实：1.1.22 起插件界面**只保留原生面板一种呈现形态** —— 仍只提供旧式预制节点界面的插件，其界面不再显示，面板位置给出说明与入口（该插件需要更新）；同一版修好了面板**取色不完整**导致的部分配色异常（浅色主题下曾出现黑底输入框、黑字按钮），面板配色现在完整跟随主题的浅/深外观。")]},{n:"07",id:"hooks",kicker:"hook 与生命周期",title:"hook 与生命周期：每轮收尾产出一行",blocks:[s("`server.hook` 让插件在**模型调用前**或 **run 结束后**注入消息片段。它由清单声明与模块导出两半组成：清单声明事件、优先级、失败策略；代码导出**模块级 `hooks` 字典**（不是 `ctx.hook(...)` —— 宿主在激活时只读这个字典的键名，真正调用发生在 `ext.hook.run`）。"),a(["字段","必需性","缺省","拒绝条件"],[["`entry`","**必需**","—","缺失 / 非字符串 ⇒ error，能力不可用；MUST 与 `server.tool` / `server.ui` 同文件"],["`events`","**必需**","—","缺失 / 非字符串数组 ⇒ error"],["`onError`","可选",'`"continue"`',"非法取值 ⇒ error；`abort` **只在 `pre_model` 有效**，其它事件降级为 `continue` 并记 `hookAbortInvalidEvent`"],["`priority`","可选","`100`","布尔值 ⇒ warning + 回落。内置注入块最大卡位 44，故插件恒在其后，**不建议设更小值**"]]),s("**事件放行集** = `{pre_model, run_finished}`；已知集六项 = `{pre_model, post_model, pre_tool, post_tool, idle, run_finished}`，其余四事件声明后会记 `hookEventWithoutDispatch`（认识但无派发点），不会拒清单。`trust` 不能写 `data`（记 `trustMismatch` 并跳过该能力）；多代码类 kind 指向不同 entry 记 `entryMismatch`。"),s("payload 是**白名单投影**五项顶层键：`conversationId` / `userContent` / `messages` / `extra` / `omittedMessageCount`。`messages` 每项只有 `role` / `content`，**拿不到** `bot` / `attachments` / `tool_calls` / `reasoning_content` / 图片字节；不可投影项是**整条省略**并用 `omittedMessageCount` 表达，不是置空。"),s("回传体只认两键 `messages` / `extra`，消息项只认三键 `position` / `role` / `content`；`position` 四枚举："),a(["position","插入语义"],[["`after-system-prefix`","插在所有前导 system 消息之后（最安全默认）"],["`end`","追加到可见消息末尾"],["`user-before`","插在**最后一个** user 消息之前；没有 user 消息时追加到末尾"],["`index:N`","插在第 N 个可见项之前（越界 ⇒ `index_out_of_range` / `index_in_prefix`）"]]),s("`role` 只允许 `system` / `user`，写 `assistant` / `tool` 整次拒绝。预算：新增条数 8、单条 content 65 536 字节、新增总量 262 144 字节、`extra` 8 192 字节、事件累计 524 288 字节；任一不合规**整次拒绝、不部分生效**（`hookRejected`）。"),i("python",["def pre_model(payload):",'    seen = len(payload.get("messages") or [])',"    return {",'        "messages": [',"            {",'                "position": "after-system-prefix",','                "role": "system",','                "content": (','                    "[HelloHook] 这条注入来自样例插件 examples.hello-hook 的 pre_model 钩子；"','                    f"它看到的可见消息数是 {seen}。样例用途，可在设置里停用。"',"                ),","            }","        ]","    }","","",'hooks = {"pre_model": pre_model}']),s("执行预算 `HOOK_TIMEOUT_SECONDS = 2.0`；异常隔离：插件异常不影响 run，只把失败类别记为 `crashed` 并继续（连续崩溃 2 次拉黑宿主，连续失败 3 次强制重建）。注册名格式三段冒号 `<extension_id>:<event>:<hook_name>`；启用时注册、停用时逐项摘除（**MUST NOT 清事件**）。"),d("时间线行与工作区快照"),s("自 1.1.21 起插件能在**时间线上产出自己的行卡片**：清单声明 `client.row`（「每轮收尾自动产生一行」），配合轮次起止 hook 采集本轮事实，行内用原生面板渲染。**行不是 slot** —— 它无实例键、无 rev、不进快照 LRU，载荷只有 32 KiB。"),s("同一版新增**工作区快照接口**：插件在 hook 里取本轮变更文件清单时**不能指定路径**，读哪个仓库由宿主按会话决定 —— 因此不存在借插件绕开路径授权的口子。"),s("1.1.20 起插件还能**读取并操作目标台账**：待办类插件能把用户交代的事变成 botChat 真正执行的目标；写入仍只走既有状态机。"),o("生命周期口径：没有热重载","只改插件包内容（`.py` / `.swift` / `manifest.json`）⇒ `POST /api/extensions/host/restart`（停 → 重扫 → 按库内 `enabled` 重激活，黑名单不清）。","改了 `serverSide/` 源码 ⇒ app 形态下必须**重新构建 App** 再启动（运行的是 bundle 里的 server 拷贝）。","被拉黑（连续 2 次崩溃）⇒ `POST /api/extensions/{id}/unblock`（幂等；未拉黑回 `removed=false`）再启用。","停用只做到「不可调用」：宿主仍持有模块，改包仍需重启宿主。")]},{n:"08",id:"trust",kicker:"权限与信任",title:"权限与信任：授权是人的显式动作",blocks:[s("缺省全空：零出网、零 keychain、零 workspace 写、零宿主工具、零模型调用。清单只写「请求」，实际授权落 `extension_state.permissions_json`。"),a(["键","形态","生效点"],[["`fs.read` / `fs.write`","路径前缀数组（`${workspace}` 会被**清单侧**展开）","宿主代发 + `realpath` 前缀比对；**写不隐含读**"],["`net`","host 数组（精确匹配，不许通配）","`ctx.host.net.fetch` 由宿主代发"],["`keychain`","键名数组","预留（本期无实现路径）"],["`tools`","宿主工具名数组","预留"],["`llm`","角色数组","`ctx.host.llm.invoke`（协议齐备但**显式失败** `hostUnavailable`）"],["`clipboard`","布尔","预留"]]),s("**授权是人的显式动作**：`enabled: true` MUST 来自人的动作，MUST NOT 由扫描自动触发。授权端点里出现过的键**整体替换**，没出现的键保持原样，给空数组即撤销；清单没请求过的键会被拒并记 `permissionDenied`（不是静默丢弃）。升版本新增权限不自动授予，权限收缩自动收敛，响应带 `pending_keys`（请求了但未授权）与 `converged_keys`（被裁掉的键）。"),d("三档执行位置（trust）"),a(["档位","执行位置","适用"],[["`data`","**不执行代码**","主题包、纯数据包。声明代码能力 ⇒ 拒绝该能力（warning），不拒包"],["`sandboxed`（代码缺省）","extension-host 子进程","外部插件"],["`in-process`","主进程内导入","仅用户 root **且** 设置里开了「信任本地插件」（`EXTENSIONS_TRUST_LOCAL`）；`builtin.` 一律降级"]]),s('`trust` 与原生面板无关：`trust` 管服务端 Python 在哪跑。文件权限最容易踩的坑是路径形态 —— **`${workspace}` 只在清单侧展开**，插件代码里 `ctx.host.fs.write("${workspace}/x")` 必被判越界（不是绝对路径）；**两侧都用 `~` 前缀**才是唯一能对齐的形态。'),i("json",['"permissions": {','  "fs.read":  ["~/.botchat/todos"],','  "fs.write": ["~/.botchat/todos"]',"}"]),s("另一条硬边界：**渲染期禁写**。`fs.write` / `net.fetch` 在 `ui.render` 期间调用会被直接拒（`permissionDenied`）且不发出任何请求；读盘可以放渲染首帧，写只能发生在动作（`ui.action`）与工具调用里。")]},{n:"09",id:"debug",kicker:"排障",title:"排障：现象 → 原因 → 处置",blocks:[s("三步定位法（别跳步）：① `check_plugin.py <包目录>` 查清单 / 包形态 / 原生面板门禁（离线、零副作用）；② 本地跑载荷校验纯函数 `app.extensions.ui_panel_payload.validate_panel_data(data)`（面板 ≤256 KB / 深度 ≤8 / 单数组 ≤2,000 项；行 ≤32 KiB）；③ 装好后看 `GET /api/extensions` 的诊断列表与 `GET /api/extensions/views`。"),a(["现象","原因","处置"],[["设置页根本没有这个插件","目录名 ≠ `id`（`packageDirNameMismatch`）/ 清单 JSON 坏（`invalidJSON`）/ `minAppVersion` 高于当前 app（`minAppVersionTooHigh`）/ `schemaVersion` 不是 1、2（`unknownSchemaVersion`）","跑 `check_plugin.py` 看 error 级诊断"],["插件在、启用后没反应","宿主没重扫 / 没激活（装配层只在启动、启用、`host/restart` 时激活）","`POST /api/extensions/host/restart`，再看该行诊断
